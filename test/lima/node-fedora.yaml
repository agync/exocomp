minimumLimaVersion: 2.0.0

# Dummy managed node for exocomp integration tests. Instance name is chosen
# by the caller (limactl start --name ...); nothing here is name-specific.
base:
- template:fedora

cpus: 2
memory: "2GiB"

# Fix the SSH forward's host port so a probe check and an inventory survive VM
# restarts — lima otherwise re-assigns the loopback port on every boot, which
# silently moves the ansible target (the lima-infra-validation "never cache
# the port" rule). Only ONE instance of this template may run at a time (the
# host port would collide).
ssh:
  localPort: 2222

# Empty lists are treated as unset by Lima's base-template merge, so the
# inherited home-directory mount is kept but forced read-only instead.
mounts:
- location: "~"
  writable: false
