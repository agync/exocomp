# The gate layer: `make check` stays the per-commit Go gate and runs as a
# repo-local system hook; hygiene and commit-format come from standard hooks.
# The full `make check-race` is not a local hook: it runs in CI and at the
# worktree-merge integration. Activate once per clone with `pip install
# pre-commit && make hooks` (which installs the pre-commit and commit-msg git
# hooks). Run everything with `make check-hygiene` (pre-commit run --all-files).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Migrations are final at merge (migration-authoring skill); the TUI
        # golden frames are byte-pinned, because trailing spaces are the frame
        # width and are semantically significant.
        exclude: ^(internal/store/migrations/|internal/tui/testdata/frames/)
      - id: end-of-file-fixer
        exclude: ^(internal/store/migrations/|internal/tui/testdata/frames/|docs/design/reference/tui/)
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # The shipped-UI renders under docs/design/assets/ are a few hundred KB
        # each; a 1 MB ceiling keeps genuine accidents out while allowing them.
        args: [--maxkb=1024]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # Conventional format (type(scope): subject). The repo-specific rules
      # conventional-pre-commit cannot express — title <= 52 chars, no
      # trailers, no AI-slop emoji — live in commit-msg-extras.
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, test, perf, build, revert]

  - repo: local
    hooks:
      - id: no-host-paths
        name: no host paths in docs
        entry: '/home/[a-z][a-z0-9_-]*/'
        language: pygrep
        types: [text]
        files: ^docs/
      - id: commit-msg-extras
        name: commit-msg extras (52 chars, no trailers, no emoji)
        entry: .agents/scripts/commit-msg-extras.sh
        language: system
        stages: [commit-msg]
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
