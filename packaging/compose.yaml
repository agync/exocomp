services:
  exocomp:
    image: ghcr.io/agync/exocomp:latest
    build:
      context: ..
      dockerfile: packaging/Containerfile
    container_name: exocomp
    restart: unless-stopped
    mem_limit: 1.5g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - exocomp-state:/var/lib/exocomp
    environment:
      EXOCOMP_IMAGE: ghcr.io/agync/exocomp:latest

volumes:
  exocomp-state: {}
