<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; background: #0A0C0D; overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #ECEFF0;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1280px; height: 640px; box-sizing: border-box;
    padding: 56px 72px 52px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace;
           font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .brand svg { width: 30px; height: 30px; }
  .url { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #8A9296; }
  .mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase; color: #BE7BEB; }
  h1 { margin: 16px 0 0; font-size: 80px; line-height: 0.96; letter-spacing: -3.2px; font-weight: 600; }
  .facts { width: 320px; flex: none; border-top: 1px solid rgba(255,255,255,.10); }
  .fact { padding: 9px 0 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .fact dt { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
             letter-spacing: 1.4px; text-transform: uppercase; color: #8A9296; margin-bottom: 2px; }
  .fact dd { margin: 0; font-size: 14px; color: #D6DBDD; }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          border-top: 1px solid rgba(255,255,255,.10); padding-top: 16px;
          font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A9296; }
  .foot span:last-child { color: #6B7477; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6.2A2.2 2.2 0 0 1 6.2 4h8.4L20 9.4v8.4A2.2 2.2 0 0 1 17.8 20H6.2A2.2 2.2 0 0 1 4 17.8Z"/>
          <circle cx="9.4" cy="14.6" r="2.1" fill="#A435CE" stroke="none"/>
        </svg>
        exocomp
      </div>
      <div class="url">exocomp.dev</div>
    </div>

    <div class="mid">
      <div>
        <div class="kicker">Homelab control plane</div>
        <h1>Your homelab,<br>one binary.</h1>
      </div>
      <dl class="facts">
        <div class="fact"><dt>Binary</dt><dd>One static Go process</dd></div>
        <div class="fact"><dt>State</dt><dd>SQLite, WAL mode</dd></div>
        <div class="fact"><dt>Delegates to</dt><dd>Ansible · OpenTofu · restic</dd></div>
        <div class="fact"><dt>Privilege</dt><dd>No sudo, anywhere</dd></div>
      </dl>
    </div>

    <div class="foot">
      <span>ansible-core · opentofu · restic · sops · age · git</span>
      <span>Apache-2.0</span>
    </div>
  </div>
</body>
</html>
